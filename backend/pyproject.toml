[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes logic checks
    "B",  # flake8-bugbear (design & security flaws)
    "S",  # flake8-bandit (Security audit rules)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]