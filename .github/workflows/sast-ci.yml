name: Full-Stack SAST & DAST Security Audit

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend_sast:
    name: Backend SAST (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Backend Security Scan
        run: |
          cd backend
          ruff check --select S app/

  frontend_sast:
    name: Frontend SAST (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Run Frontend Security Scan
        run: |
          cd frontend
          npx eslint src/ --ext .js,.jsx

  dast_security_audit:
    name: Full-Stack DAST (Pytest + Node)
    runs-on: ubuntu-latest
    needs: [backend_sast, frontend_sast]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: TestDbPassword123
          POSTGRES_DB: telecom_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_PASSWORD: TestDbPassword123
      JWT_SECRET_KEY: ci-ephemeral-jwt-secret-key-for-dast-verification
      BROWSER: none

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python & Node.js
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Backend & Frontend Dependencies
        run: |
          cd backend && pip install -r requirements.txt pytest httpx
          cd ../frontend && npm install

      - name: Initialize PostgreSQL Schema & Seed Test Accounts
        working-directory: backend
        run: |
          python -c "
          from argon2 import PasswordHasher
          from app.db.session import engine, SessionLocal
          from app.models.entities import Base, User, UserRole

          Base.metadata.create_all(bind=engine)
          ph = PasswordHasher()
          db = SessionLocal()
          for email, pwd, role in [
              ('subscriber@telecom.com', 'UserPassword123!', UserRole.subscriber),
              ('admin@telecom.com', 'AdminPassword123!', UserRole.admin),
          ]:
              if not db.query(User).filter(User.email == email).first():
                  db.add(User(email=email, password_hash=ph.hash(pwd), role=role))
          db.commit()
          db.close()
          print('CI Database initialized and seeded.')
          "

      - name: Start Backend & Frontend Servers and Run DAST Suites
        run: |
          cd backend
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          BACKEND_PID=$!

          cd ../frontend
          npm start &
          FRONTEND_PID=$!

          echo "Waiting for FastAPI and React servers to become ready..."
          npx -y wait-on http://127.0.0.1:8000/openapi.json http://localhost:3000 -t 60000

          echo "Running Backend Automated DAST..."
          cd ../backend
          pytest -v tests/test_dast_security.py

          echo "Running Frontend Automated DAST..."
          cd ../frontend
          node --test tests/dast_frontend.test.mjs

          kill $BACKEND_PID $FRONTEND_PID || true